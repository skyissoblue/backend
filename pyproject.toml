[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "progressive-stock-selection"
version = "0.2.0"
description = "A deterministic progressive stock-selection engine"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.16",
    "pandas>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "mysql-connector-python>=8.3",
    "pyarrow>=14",
    "APScheduler>=3.10",
    "redis>=5.0",
    "TA-Lib>=0.6.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["selection_engine*", "factor_system*"]

[tool.pytest.ini_options]
testpaths = ["selection_engine", "factor_system"]
pythonpath = ["."]
